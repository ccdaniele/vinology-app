# PostgreSQL. Prefer DATABASE_URL when present (Docker / production).
# Local Postgres.app defaults to your macOS username with an empty password.

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", "5432") %>
  username: <%= ENV.fetch("DB_USERNAME") { ENV.fetch("USER", "postgres") } %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "vinology_development") %>
  <% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
  <% end %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST", "vinology_test") %>
  <% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV.fetch("DATABASE_URL").sub(/\/[^\/?\s]+(\?|$)/, '/vinology_test\1') %>
  <% end %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "vinology_production") %>
  <% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
  <% end %>
